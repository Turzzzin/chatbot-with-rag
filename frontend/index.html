<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <title>Chatbot RAG</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,700,300" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/material-design-iconic-font/2.1.2/css/material-design-iconic-font.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div id="warning-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Aviso Importante</h2>
            <p>As respostas são geradas por Inteligencia Artificial e não substituem a orientação de um profissional de saúde.</p> 
            <p>Sempre consulte um médico para obter recomendações personalizadas e seguras.</p>
        </div>
    </div>
    <div class="card">
        <div class="theme-toggle-container">
            <button id="theme-toggle">🌙</button>
        </div>
        <div id="message-section">
        </div>
        <div id="input-section">
            <input
                id="input"
                type="text"
                placeholder="Digite sua mensagem"
                autocomplete="off"
                autofocus="autofocus"
            />
            <button class="send" id="btnEnviar" type="button">
                <div class="circle"><i class="zmdi zmdi-mail-send"></i></div>
            </button>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
